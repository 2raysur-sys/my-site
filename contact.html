<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rays official website</title>
  <meta name="description" content="ページの概要文を記載します">
  <script src="./js/toggle-menu.js"></script>
  <link href="./css/common.css" rel="stylesheet">
  <link href="./css/contact.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="pageWrap">
    <!-- headerここから -->
    <header class="header">
      <div class="header-inner">
        <h1 class="logo">
          <a class="header-logo" href="./index.html">
            <img src="./images/common/logo_Rays_Blue.png" alt="Rays">
          </a>
        </h1>
        <button class="toggle-menu-button"></button>
        <div class="header-site-menu">
          <nav class="site-menu">
            <ul>
              <li><a href="./concept.html">CONCEPT</a></li>
              <li><a href="./news.html">NEWS</a></li>
              <li><a href="./creators.html">CREATORS</a></li>
              <li><a href="./contact.html">CONTACT</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </header>
    <!-- headerここまで -->

    <!-- mainここから -->
    <main class="main">
      <section class="section-page-top">
        <h2 class="page-title">CONTACT</h2>
      </section>
      <section class="section-mailform">
        <div class="mailform">
          <h3>お問い合わせメール・お見積り相談</h3>
          <!-- <p>お問い合わせは、下記フォームに必要事項とお問い合わせ内容のご入力をお願いします。</p> -->
          <form action="#">
            <dl class="form-area">
              <dt><span class="required">お名前</span></dt>
              <dd><input class="input-text" type="text" name="name" required></dd>
              <dt><span class="required">メールアドレス</span></dt>
              <dd><input class="input-text" type="email" name="email" required></dd>
              <dt>お電話番号</dt>
              <dd><input class="input-text" type="tel" name="tel"></dd>
              <dt><span class="required">お問い合わせ内容</span></dt>
              <dd><textarea class="message" name="message" required></textarea></dd>
            </dl>
            <p class="confirm-text">ご入力内容をご確認の上、お間違いがなければ［Submit］ボタンを押してください。</p>
            <button class="submit-button" type="submit">Submit</button>
          </form>
        </div>
      </section>
    </main>
    <!-- mainここまで -->

    <!-- footerここから -->
    <footer class="footer">
      <nav class="site-menu">
        <ul>
          <li><a href="./privacypolicy.html">PRIVACY POLICY</a></li>
        </ul>
      </nav>
      <p class="copyright"><small>&copy;Rays</small></p>
    </footer>
    <!-- footerここまで -->
  </div>
</body>

</html>
